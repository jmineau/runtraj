[build-system]
requires = ["setuptools>=77", "setuptools-scm>=8"]
build-backend = "setuptools.build_meta"

[project]
name = "runtraj"
dynamic = ["version"]  # from git tags, via setuptools-scm
description = "Run particle dispersion models at scale."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    {name = "James Mineau", email = "jameskmineau@gmail.com"}
]
keywords = ["hysplit", "particle-dispersion", "atmospheric-transport", "lagrangian", "trajectories", "meteorology"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Atmospheric Science",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Typing :: Typed",
]
dependencies = [
    "arlmet>=0.1.0b12,<0.2",
    "fsspec>=2024.12.0",  # the first whose memory store opens a file with mode "x", as inputs.lock does
    "numpy>=1.26",  # cartopy 0.26 needs it
    "pandas>=2.1",  # xarray 2024.10 needs it
    "pyarrow>=14.0",
    "pyproj>=3.5",
    "pydantic>=2.5.3",  # 2.4 and earlier take NaN for a setting with a lower bound; 2.5.0 fails the fetch settings (unhashable dict)
    "pyyaml>=6.0",
    "scipy>=1.10",
    "shapely>=2.0",
    "typer>=0.15.4",  # older ones fail with click 8.2 and later (make_metavar)
    "universal-pathlib>=0.3.0",  # 0.2.x warns on S3 paths (PendingDeprecationWarning)
    "xarray>=2024.10.0",  # earlier ones fail to decode the CF trajectory export's time axis
]

[project.optional-dependencies]
visualization = [
    "cartopy>=0.26",  # earlier ones give a projection across 180 without the prime meridian parameter the map tests check
    "matplotlib>=3.7",
]
download = [
    "arlmet[archives]>=0.1.0b12,<0.2",
]
concentration = [
    "netcdf4>=1.6.5",  # a concentration result is a NetCDF file, a group per grid
]
complete = [
    "runtraj[visualization]",
    "runtraj[download]",
    "runtraj[concentration]",
]

[dependency-groups]
# Dev tooling and docs together; `uv sync` installs it by default.
dev = [
    # The extras, spelled out: the floors job resolves the group with `uv pip
    # compile`, which would look for `runtraj[complete]` on PyPI.
    "arlmet[archives]>=0.1.0b12,<0.2",
    "cartopy>=0.26",
    "cf-xarray>=0.10",  # the CF trajectory export is read back with it
    "netcdf4>=1.6.5",  # the concentration extra; the CF export's tests write a file with it
    "docstr-coverage>=2.3",
    "git-cliff>=2.10",  # `just changelog`
    "import-linter>=2.0",
    "ipython>=9.0",  # `.. ipython::` in the docs
    "matplotlib>=3.8",  # `.. plot::` in the docs
    "pre-commit>=4.0",
    "pydata-sphinx-theme>=0.22",  # older themes show the version banner on stable/ for PEP 440 versions
    "pyrefly>=1.3",
    "pytest>=9.0",
    "pytest-cov>=6.0",
    "pytest-dotenv>=0.5.2",
    "pytest-xdist>=3.6",
    "ruff>=0.16",
    "rust-just>=1.42.4",
    "setuptools-scm>=8",  # `just version`
    "sphinx>=8.2",  # what pydata-sphinx-theme 0.22 requires
    "sphinx-autobuild>=2024.10",  # `just docs-serve`
    "sphinx-autodoc-typehints>=3.0",
    "sphinx-copybutton>=0.5",
    "sphinx-design>=0.5",
    "trajan>=0.12",  # the CF trajectory export is opened with it
    "twine>=6.0",  # `just dist`
    # The object-store tests run against a moto server.
    "flask>=3.0",
    "flask-cors>=4.0",
    "moto[s3]>=5.1",
    "s3fs>=2024.2",
]

[project.urls]
Homepage = "https://github.com/jmineau/runtraj"
Documentation = "https://jmineau.github.io/runtraj/"
Repository = "https://github.com/jmineau/runtraj"
Issues = "https://github.com/jmineau/runtraj/issues"
Changelog = "https://github.com/jmineau/runtraj/blob/main/CHANGELOG.md"

[tool.coverage.run]
source = ["runtraj"]
branch = true

[tool.coverage.report]
show_missing = true
exclude_also = [
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
    "@(abc\\.)?abstractmethod",
    "def __repr__",
]

[tool.importlinter]
root_package = "runtraj"
# An import used only for type hints is not a dependency at run time.
exclude_type_checking_imports = true

# The package in layers, top to bottom: a module may import the layers
# below it, never those above. Modules that import each other share a layer
# (joined by ":"); "|" joins modules that must not. Releases and the raster
# layer import nothing above them; a transport model's package, in the
# models layer, does not import the project config. Exhaustive, so a new
# module has to be placed. Imports inside functions count.
[[tool.importlinter.contracts]]
name = "The package's layers"
type = "layers"
containers = ["runtraj"]
exhaustive = true
layers = [
    "__main__",
    "cli",
    "project : execution : config",
    "check | fetch",
    "simulation",
    "output",
    "stages",
    "identity : meteorology : models",
    "results",
    "particles | concentration",
    "releases : visualization",
    "transforms",
    "sampling",
    "spatial",
    "_plugins",
    "_paths | exceptions | _transient",
]

# A transport model built in, such as HYSPLIT, is a package under
# runtraj.models, reached through runtraj.models.get_model. Its package is
# the only place that knows the model's files and behavior, so another
# model does not have to touch the core. Every module under runtraj.models
# counts as a model's package: code the models share goes in
# runtraj/models/__init__.py or elsewhere in the core, not beside them.
[[tool.importlinter.contracts]]
name = "Only runtraj.models imports a transport model's package"
type = "forbidden"
source_modules = ["runtraj.*"]
forbidden_modules = ["runtraj.models.*"]
# get_model imports a model's package when asked for it; that is the boundary.
ignore_imports = [
    "runtraj.models -> runtraj.models.*",
]
allow_indirect_imports = true

# Each transport model stands alone: what two models share belongs in the
# core, behind the transport model protocol.
[[tool.importlinter.contracts]]
name = "A transport model's package imports no other model's"
type = "independence"
modules = ["runtraj.models.*"]
# Each model imports runtraj.models for the protocol, and get_model imports
# each model: a path between two models through it is not one importing the
# other.
ignore_imports = [
    "runtraj.models -> runtraj.models.*",
]

# Config classes do no I/O when they validate, so a config.yaml loads
# offline. Asking a transport model its build, or a stage to read the files
# its settings name, happens on request, in ProjectConfig.resolve. The config
# never reads results or runs anything. It shares a layer with the project
# and the execution package, which import each other, so this is its own
# contract.
[[tool.importlinter.contracts]]
name = "The project config reads no results and runs nothing"
type = "forbidden"
source_modules = ["runtraj.config"]
forbidden_modules = [
    "runtraj.execution.kubernetes",
    "runtraj.execution.runner",
    "runtraj.execution.worker",
    "runtraj.output",
    "runtraj.project",
    "runtraj.simulation",
    "runtraj.models.*",
]
allow_indirect_imports = true

[tool.pyrefly]
project-includes = ["src"]
python-version = "3.11"  # as CI checks, against the oldest supported Python

[tool.pytest]
minversion = "9.0"
testpaths = ["tests", "src"]  # src: the docstring examples (--doctest-modules below)
strict = true  # strict markers, config, xfail and parametrize ids
addopts = ["-ra", "--doctest-modules"]  # run the `>>>` examples in docstrings as tests
log_level = "INFO"  # show captured logs for failing tests
# Warnings are errors, so deprecations surface early. Ignore a specific
# third-party warning with e.g. "ignore:some message:DeprecationWarning:pkg".
filterwarnings = [
    "error",
    # numpy ignores this one itself (compiled packages such as netCDF4 raise it on
    # import); pytest's "error" filter would bring it back.
    "ignore:numpy.ndarray size changed:RuntimeWarning",
    # matplotlib before 3.10.7 calls pyparsing methods that pyparsing 3.3 deprecates;
    # the floors job installs matplotlib 3.8.
    "ignore::pyparsing.warnings.PyparsingDeprecationWarning",
]
markers = [
    # `just test` does not run these; CI runs -m integration (tests.yml).
    "integration: runtraj end to end, with real met files and HYSPLIT (slow)",
]
env_files = [".env"]

[tool.repo-review]
# Scientific Python repo-review (`uvx --from "sp-repo-review[cli]" sp-repo-review .`)
# checks that python-template skips on purpose:
ignore = [
    "PY007",  # task runner: just, not nox/tox
    "MY101",  # pyrefly's default preset; tighten per project
    "PC110", "PC190",  # ruff runs as a local `uv run` hook, so uv.lock pins its version
    "PC140",  # pyrefly runs as a local `uv run` hook, so it sees the project's dependencies
    "PC160",  # no spell checker
    "PC180",  # no markdown formatter
    "PC901", "PC902", "PC903",  # pre-commit.ci is not used
]

[tool.ruff]
# target-version comes from project.requires-python

[tool.ruff.format]
docstring-code-format = true
# ruff also formats code blocks in Markdown; these keep their examples as written
# (e.g. hand-aligned comments).
exclude = ["README.md", "AGENTS.md"]

[tool.ruff.lint]
select = [
    "E",  # pycodestyle
    "F",  # Pyflakes
    "UP",  # pyupgrade
    "B",  # flake8-bugbear
    "SIM",  # flake8-simplify
    "I",  # isort
    "D",  # pydocstyle, NumPy convention (below)
    "D213",  # docstring summary on the second line
    "NPY",  # NumPy-specific, incl. NumPy 2 deprecations
    "RUF100",  # unused noqa
]
ignore = [
    "E501",  # line too long, handled by formatter
    "D105",  # magic methods need no docstring (docstr-coverage skips them too)
    "D200",  # One-line docstring should fit on one line with quotes
    "D212",  # Multi-line docstring summary should start at the first line
    "D400",  # First line should end with a period, question mark, or exclamation point
]

[tool.ruff.lint.per-file-ignores]
# Tests need no docstrings, and a fixture's names what it provides ("A point
# release."); the other docstring rules still apply to them.
"tests/**" = ["D100", "D101", "D102", "D103", "D104", "D106", "D107", "D401"]

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.ruff.lint.isort]
known-first-party = ["runtraj"]

[project.scripts]
runtraj = "runtraj.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"runtraj" = ["py.typed"]

[tool.setuptools_scm]
# Releases are git tags vX.Y.Z (see CONTRIBUTING.md). Between releases the
# version is the next one as a dev version, e.g. 0.1.0a23.dev3+g1a2b3c4.
fallback_version = "0.0.0"  # no git metadata at all (e.g. a bare source copy)

[tool.uv]
required-version = ">=0.12"
# Rebuild the editable install when the build config or the git state changes,
# so `__version__` follows new commits and tags.
cache-keys = [
    { file = "pyproject.toml" },
    { file = "setup.py" },
    { git = { commit = true, tags = true } },
]
