name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # HYSPLIT runs on Linux, macOS and Windows. The unit tests need no hycs_std.
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    env:
      UV_NO_SYNC: "1"  # `just` recipes run in the environment synced below
    defaults:
      run:
        shell: bash  # Git for Windows' bash, so the steps and `just` read alike on every OS

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0  # setuptools-scm reads the version from tags

      - uses: astral-sh/setup-uv@v10.3.3
        with:
          version: "0.12.23"
          python-version: ${{ matrix.python-version }}

      - name: Install
        run: uv sync --locked

      - name: Unit tests
        run: uv run just cov

      # A job that runs tests this one skips (say, one with optional extras
      # installed) should upload its own coverage.xml the same way: Codecov merges
      # the uploads, and a line run in either job counts as covered. Without it,
      # the modules behind the extras show as untested.
      - name: Upload coverage to Codecov
        if: ${{ matrix.os == 'ubuntu-latest' && matrix.python-version == '3.11' && !cancelled() }}
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage.xml

      - name: Upload test results to Codecov
        if: ${{ matrix.os == 'ubuntu-latest' && matrix.python-version == '3.11' && !cancelled() }}
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: junit.xml
          report_type: test_results

  # The lowest versions pyproject.toml allows, on the oldest Python. Every
  # direct dependency needs a minimum: without one, uv picks its oldest release.
  floors:
    name: minimum dependencies / Python 3.11
    runs-on: ubuntu-latest
    env:
      UV_NO_SYNC: "1"  # `just` recipes run in the environment installed below

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0  # setuptools-scm reads the version from tags

      - uses: astral-sh/setup-uv@v10.3.3
        with:
          version: "0.12.23"
          python-version: "3.11"

      - name: Install
        run: uvx --from rust-just just sync-floors

      - name: Test
        run: uv run just test

  # The integration tests replay real HYSPLIT runs recorded on the oldest
  # supported version (5.0.2) and the newest (tests/recorded/hysplit/; CONTRIBUTING.md,
  # "Testing against real HYSPLIT"). No HYSPLIT program is on the runner, so
  # the replay runs wherever HYSPLIT does: Linux, macOS and Windows.
  integration:
    name: ${{ matrix.os }} / Integration tests / HYSPLIT ${{ matrix.hysplit }} (recorded)
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        hysplit: ["5.0.2", "5.4.2"]
    env:
      UV_NO_SYNC: "1"
    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0  # setuptools-scm reads the version from tags

      - uses: astral-sh/setup-uv@v10.3.3
        with:
          version: "0.12.23"
          python-version: "3.12"

      - name: Install
        run: uv sync --locked

      - name: Restore HRRR met cache
        id: met-cache
        uses: actions/cache/restore@v6
        with:
          path: tests/met_cache
          # Bump the version suffix when _MET_BLOCKS changes in conftest.py
          # (the same key in docs.yml). The recorded HYSPLIT runs were recorded
          # on the files this fetch makes with the locked arlmet (their
          # recorded.yaml); a replay stops when the files here differ.
          # GitHub keeps a cache per operating system unless it is saved and
          # restored with enableCrossOsArchive, as here, so the files one job
          # downloads serve every job, macOS included.
          key: met-hrrr-2021-v3
          enableCrossOsArchive: true

      - name: Prewarm HRRR met cache
        if: steps.met-cache.outputs.cache-hit != 'true'
        env:
          RUNTRAJ_TEST_FETCH_MET: "1"
        run: |
          uv run pytest \
            tests/models/hysplit/test_release_assignment.py::test_hysplit_multipoint_release_points_follow_control_order \
            --setup-only -q

      - name: Save HRRR met cache
        if: steps.met-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: tests/met_cache
          key: ${{ steps.met-cache.outputs.cache-primary-key }}
          enableCrossOsArchive: true

      - name: Run integration tests on the recorded runs
        env:
          RUNTRAJ_TEST_MET_DIR: ${{ github.workspace }}/tests/met_cache
        # One worker per core (4 on ubuntu-latest, 3 on macos-latest);
        # conftest.py groups the tests that share a HYSPLIT run.
        run: uv run just test-replay ${{ matrix.hysplit }} -v

  package:
    name: Package smoke test
    runs-on: ubuntu-latest
    env:
      UV_NO_SYNC: "1"

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0  # setuptools-scm reads the version from tags

      - uses: astral-sh/setup-uv@v10.3.3
        with:
          version: "0.12.23"
          python-version: "3.12"

      - name: Install
        run: uv sync --locked

      - name: Build and check the sdist and wheel
        run: uv run just dist

      - name: Install the wheel in a clean environment
        run: |
          uv venv .pkgtest
          uv pip install --python .pkgtest dist/*.whl

      - name: Smoke test the installed package
        run: |
          .pkgtest/bin/python -c "import runtraj; print(runtraj.__version__)"
          .pkgtest/bin/python -m runtraj --help
          .pkgtest/bin/runtraj --help

      - name: Check the wheel and sdist hold no HYSPLIT file
        run: |
          .pkgtest/bin/python - <<'PY'
          import tarfile
          import zipfile
          from pathlib import Path

          hysplit = ("hycs_std", "ASCDATA.CFG", "LANDUSE.ASC", "ROUGLEN.ASC", "TERRAIN.ASC")
          for wheel in Path("dist").glob("*.whl"):
              found = [n for n in zipfile.ZipFile(wheel).namelist() if n.endswith(hysplit)]
              assert not found, f"{wheel.name} holds {found}"
          for sdist in Path("dist").glob("*.tar.gz"):
              found = [n for n in tarfile.open(sdist).getnames() if n.endswith(hysplit)]
              assert not found, f"{sdist.name} holds {found}"
          PY

      - name: Without hycs_std, the installed package says what to set
        run: |
          .pkgtest/bin/python - <<'PY'
          from runtraj.exceptions import HYSPLITNotFoundError
          from runtraj.models.hysplit import find_hycs_std

          try:
              find_hycs_std()
          except HYSPLITNotFoundError as err:
              print(err)
          else:
              raise SystemExit("found a hycs_std on a runner that has none")
          PY
