name: Code Quality

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    env:
      UV_NO_SYNC: "1"  # `just` recipes run in the environment synced below
      RUFF_OUTPUT_FORMAT: github  # annotate the PR diff

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0  # setuptools-scm reads the version from tags

      - uses: astral-sh/setup-uv@v10.3.3
        with:
          version: "0.12.23"
          python-version: "3.11"

      - name: Install
        run: uv sync --locked

      - name: Lint and format check
        run: uv run just lint

      - name: Type check
        if: ${{ !cancelled() }}
        run: uv run just type-check

      - name: Import contracts
        if: ${{ !cancelled() }}
        run: uv run just imports

      - name: HYSPLIT's setting names stay in its package
        if: ${{ !cancelled() }}
        run: |
          names='numpar|outdt|kmixd|maxpar|krand|ichem|varsiwant|siguverr|tluverr|zcoruverr|horcoruverr|sigzierr|tlzierr|horcorzierr'
          # grep exits 1 when it finds nothing, and 2 on an error, which must fail.
          found="$(grep -rniE "$names" src/runtraj --include='*.py')" || [ $? -eq 1 ]
          # Only HYSPLIT's own package may use them freely; elsewhere the line's text must say HYSPLIT.
          hits="$(printf '%s\n' "$found" | grep -v '^src/runtraj/models/hysplit/' | grep -vE '^[^:]+:[0-9]+:.*\bHYSPLIT\b')" || true
          if [ -n "$hits" ]; then
            echo "HYSPLIT's setting names outside runtraj/models/hysplit/, on lines that do not name HYSPLIT:"
            echo "$hits"
            echo "Move the code into HYSPLIT's package, or say the setting is HYSPLIT's on the same line."
            exit 1
          fi

      - name: Docstring coverage
        if: ${{ !cancelled() }}
        run: uv run just docstr
