# A two-release project for the end-to-end test on a kind cluster
# (.github/workflows/kubernetes.yml). The met is one cropped HRRR file,
# mounted in the pods at /met; the inputs and results are on the cluster's
# S3 server. A backward run also needs the hour after its release, so the
# releases (releases.csv) end at 04:00: 05:00 would need the 06:00 file.
mets:
  hrrr: /met
models:
  hysplit:
    directory: /opt/hysplit
    n_hours: -3
    numpar: 100
variants:
  hrrr: {}
output: s3://runtraj/output
execution:
  backend: kubernetes
  kubernetes:
    image: runtraj:ci
    completions: 2
    inputs: s3://runtraj/projects/demo
    secrets: [bucket-creds]
    volumes:
      - {claim_name: met, mount_path: /met, read_only: true}
